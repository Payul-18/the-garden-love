@keyframes jPasto { 0%,100% { transform: skewX(-2.5deg); } 50% { transform: skewX(2.5deg); } }

@keyframes jAleteo { 0%,100% { transform:scaleY(1) } 50% { transform:scaleY(.35) } }

@keyframes jPolen { 0% { transform:translate(0,0); opacity:0 } 15% { opacity:.85 } 100% { transform:translate(38px,-120px); opacity:0 } }
@keyframes jBrillo { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
